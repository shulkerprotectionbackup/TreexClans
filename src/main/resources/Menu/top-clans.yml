id: tops
title: "&0&lВсе кланы"
size: 54
open_permission: none
open_args:
  - top

listen: top_clans

# Available types
# clans
Items:

  clans:
    type: clans
    display_name: "&6#%top_num% %prefix% &8(%clan_tag%)"
    slot:
      - '10-17'
      - '19-25'
      - '28-34'
      - '37-43'
    lore:
      - "&6&m                    "
      - "&6⌚ &fЛидер &6&l%leader_name%"
      - "&6&m                    "
      - "&6&lСтатистика"
      - "&6⚗ &fУровень: &6&l%level%"
      - "&6⚔ &fУбийств: &6&l%kills%"
      - "&6☠ &fСмертей: &6&l%deaths%"
      - "&6🛡 &fК/Д: &6&l%kd%"
      - "&6$ &fБаланс: &6&l%balance%"
      - "&6&m                    "


  next_page:
    material: SPECTRAL_ARROW
    type: next_page
    slot: 52
    display_name: "&aСледующая страница ▶"


  filter:
    material: HOPPER
    type: filter
    slot: 49
    display_name: "&aФильтровать по:"
    lore:
      # Можно настроить в messages
      - "%top_kills_set%"
      - "%top_deaths_set%"
      - "%top_kd_set%"
      - "%top_level_set%"
      - "%top_balance_set%"
      - "%top_members_set%"


  prev_page:
    material: ARROW
    slot: 46
    type: prev_page
    display_name: "&c◀ Предыдущая страница"

  orange:
